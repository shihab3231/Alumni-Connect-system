
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alumni Connect System</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Alumni Connect System</h1>

<div class="container">

<h2>Add Alumni</h2>

<form id="alumniForm">

<input type="hidden" id="alumniId">

<label>Name</label>
<input type="text" id="name" required>

<label>Graduation Year</label>
<input type="number" id="year" required>

<label>Department</label>
<input type="text" id="department" required>

<label>Company</label>
<input type="text" id="company" required>

<label>Job Title</label>
<input type="text" id="job" required>

<label>Email</label>
<input type="email" id="email" required>

<button type="submit">Save Alumni</button>

</form>

</div>

<h2>Alumni List</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Company</th>
<th>Job Title</th>
<th>Year</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="alumniTable">

</tbody>

</table>

<script src="script.js"></script>


<h2>Upcoming Events</h2>

<div class="container">
  <h3>Add Event</h3>
  <form id="eventForm">
    <input type="hidden" id="eventId">

    <label>Event Name</label>
    <input type="text" id="eventName" required>

    <label>Date</label>
    <input type="date" id="eventDate" required>

    <label>Description</label>
    <textarea id="eventDesc" required></textarea>

    <button type="submit">Save Event</button>
  </form>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Event Name</th>
      <th>Date</th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="eventTable"></tbody>
</table>



</body>
</html>
